<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>京爷的一天 | BJMan</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>《京爷的一天》<span>BJMan</span></h1>
        <p class="subtitle">一款现实主义文字互动游戏：日常、选择、后果、反复、真实。</p>
      </header>

      <section class="stats" id="stats"></section>

      <section class="scene-card">
        <p class="time" id="timeTag"></p>
        <h2 id="sceneTitle"></h2>
        <p class="desc" id="sceneDesc"></p>
        <div id="options" class="options"></div>
      </section>

      <section class="log-card">
        <h3>今天的账</h3>
        <ul id="logList"></ul>
      </section>

      <section id="ending" class="ending hidden"></section>

      <footer>
        <button id="restartBtn" class="hidden">重来一天</button>
      </footer>
    </main>

    <script src="game.js"></script>
  </body>
</html>
